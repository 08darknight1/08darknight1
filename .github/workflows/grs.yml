# This is a basic workflow to help you get started with Actions
# getting everything from here: https://github.com/anuraghazra/github-readme-stats?tab=readme-ov-file#showing-commits-count-for-specified-year
# and also here: https://github.com/stats-organization/github-readme-stats-action#readme
# colocando mais um comentário aqui pra ver se cria um novo workflow la no actions pq pqp que negocinho chato

env: { FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true }

name: Update README cards

# Controls when the workflow will run
on:
  schedule:
    - cron: "0 3 * * *" 
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Triggers the workflow on push or pull request events but only for the "main" branch
  ##push:
    ##branches: [ "main" ]
  ##pull_request:
   ##branches: [ "main" ]


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.Stats_Token }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.Stats_Token }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

      # Runs a single command using the runners shell
      ##- name: Run a one-line script
        ##run: echo Hello, world!

      # Runs a set of commands using the runners shell
      ##- name: Run a multi-line script
        ##run: |
          ##echo Add other actions to build,
          ##echo test, and deploy your project.
